<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Laboratorium IPA Terpadu</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: #172033; background: #f5f7fb; }
    .bar { position: fixed; z-index: 2; inset: 0 0 auto; min-height: 54px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 8px 16px; background: #fff; border-bottom: 1px solid #dfe5ef; }
    .title { font-weight: 700; }
    .open { display: inline-block; flex: none; padding: 8px 12px; border-radius: 8px; color: #fff; background: #185abc; text-decoration: none; font-weight: 600; }
    .open:hover { background: #124a9f; }
    main { position: fixed; inset: 54px 0 0; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
    @media (max-width: 480px) { .bar { min-height: 50px; padding: 7px 10px; } main { inset-block-start: 50px; } .title { font-size: 14px; } .open { padding: 7px 9px; font-size: 13px; } }
  </style>
</head>
<body>
  <header class="bar">
    <div class="title">Laboratorium IPA Terpadu</div>
    <a class="open" href="https://script.google.com/macros/s/AKfycbxV5lzDSQN_SULVE8yGaSSEJAD9JwH_3IyY3laFaqGq29dsRIRmrNReJjoJnNyQ2mgh/exec" target="_blank" rel="noopener">Buka langsung</a>
  </header>
  <main>
    <iframe
      src="https://script.google.com/macros/s/AKfycbxV5lzDSQN_SULVE8yGaSSEJAD9JwH_3IyY3laFaqGq29dsRIRmrNReJjoJnNyQ2mgh/exec"
      title="Aplikasi Laboratorium IPA Terpadu"
      allow="camera; clipboard-read; clipboard-write"
      allowfullscreen>
    </iframe>
  </main>
</body>
</html>
