<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#eee">
  <title>Laboratorium IPA Terpadu</title>
  <link rel="icon" href="https://lh3.googleusercontent.com/d/11LSUY7MX8y_SSsBJ8BikWgDwKDJqUnkM#.png">
  <style>
    html,
    body {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background-color: #eee;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-y: auto;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      /* Ruang tipis memberi browser area overscroll di tepi halaman. */
      padding-bottom: 2px;
    }

    .iframe-container {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: visible;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: 0;
      overscroll-behavior-y: auto;
      touch-action: pan-y;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <iframe
      id="app"
      src="https://script.google.com/macros/s/AKfycbxV5lzDSQN_SULVE8yGaSSEJAD9JwH_3IyY3laFaqGq29dsRIRmrNReJjoJnNyQ2mgh/exec"
      title="Laboratorium IPA Terpadu"
      allowfullscreen
      allow="fullscreen; camera; microphone; display-capture; geolocation">
    </iframe>
  </div>
</body>
</html>
